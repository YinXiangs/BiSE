    .header-btn {

<!-- 简化的脚本: 核心噪波生成 + UI 联动 -->
<script>
  (function(){
    // ----- 基础 Value Noise -----
    function generateNoise(width, height, freq, octaves, amplitude, seed) {
      const data = new Uint8Array(width * height * 4);
      function hash(x, y, s) {
        let h = s + x * 374761393 + y * 668265263;
        h = (h ^ (h >> 13)) * 1274126177;
        h = h ^ (h >> 16);
        return (h & 0x7fffffff) / 0x7fffffff;
      }
      function smoothNoise(x, y, f, s) {
        const fx = x / width * f;
        const fy = y / height * f;
        const ix = Math.floor(fx);
        const iy = Math.floor(fy);
        const fx2 = fx - ix, fy2 = fy - iy;
        const ux = fx2 * fx2 * (3 - 2 * fx2);
        const uy = fy2 * fy2 * (3 - 2 * fy2);
        const v00 = hash(ix, iy, s);
        const v10 = hash(ix+1, iy, s);
        const v01 = hash(ix, iy+1, s);
        const v11 = hash(ix+1, iy+1, s);
        return (v00 * (1-ux) + v10 * ux) * (1-uy) + (v01 * (1-ux) + v11 * ux) * uy;
      }
      for (let y=0; y<height; y++) {
        for (let x=0; x<width; x++) {
          let val = 0, amp = amplitude, f = freq;
          for (let o=0; o<octaves; o++) {
            val += smoothNoise(x, y, f, seed + o*100) * amp;
            amp *= 0.5;
            f *= 2;
          }
          val = Math.max(0, Math.min(1, val));
          const idx = (y*width + x)*4;
          const g = Math.floor(val * 255);
          data[idx] = g; data[idx+1] = g; data[idx+2] = g; data[idx+3] = 255;
        }
      }
      return new ImageData(data, width, height);
    }

    // ----- DOM refs -----
    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('editor-save-status');

    const freqSlider = document.getElementById('freq-slider');
    const octSlider = document.getElementById('oct-slider');
    const ampSlider = document.getElementById('amp-slider');
    const seedInput = document.getElementById('seed-input');
    const freqVal = document.getElementById('freq-val');
    const octVal = document.getElementById('oct-val');
    const ampVal = document.getElementById('amp-val');
    const contrastSlider = document.getElementById('contrast-slider');
    const brightSlider = document.getElementById('bright-slider');
    const invertCheck = document.getElementById('invert-check');
    const gradEnable = document.getElementById('grad-enable-toggle');
    const blackBg = document.getElementById('chk-black-bg');
    const cbBg = document.getElementById('chk-cb-bg');

    // 绘制函数
    function drawNoise() {
      const freq = parseFloat(freqSlider.value);
      const oct = parseInt(octSlider.value);
      const amp = parseFloat(ampSlider.value);
      const seed = parseInt(seedInput.value) || 42;
      const contrast = parseFloat(contrastSlider.value);
      const bright = parseFloat(brightSlider.value);
      const invert = invertCheck.checked;

      try {
        const imageData = generateNoise(512, 512, freq, oct, amp, seed);
        // 后处理: contrast, brightness, invert
        const data = imageData.data;
        for (let i=0; i<data.length; i+=4) {
          let r = data[i] / 255;
          // 对比度
          r = (r - 0.5) * contrast + 0.5;
          // 亮度
          r += bright;
          r = Math.max(0, Math.min(1, r));
          if (invert) r = 1 - r;
          const g = Math.floor(r * 255);
          data[i] = g; data[i+1] = g; data[i+2] = g;
        }
        ctx.putImageData(imageData, 0, 0);
        status.textContent = '✅ 已更新';
        status.style.color = '#6fcb9e';
      } catch(e) {
        status.textContent = '❌ 生成失败';
        status.style.color = '#f87171';
        console.error(e);
      }
    }

    // 事件绑定
    freqSlider.addEventListener('input', ()=>{ freqVal.textContent = freqSlider.value; drawNoise(); });
    octSlider.addEventListener('input', ()=>{ octVal.textContent = octSlider.value; drawNoise(); });
    ampSlider.addEventListener('input', ()=>{ ampVal.textContent = ampSlider.value; drawNoise(); });
    seedInput.addEventListener('change', drawNoise);
    contrastSlider.addEventListener('input', ()=>{ contrastVal.textContent = parseFloat(contrastSlider.value).toFixed(2); drawNoise(); });
    brightSlider.addEventListener('input', ()=>{ brightVal.textContent = parseFloat(brightSlider.value).toFixed(2); drawNoise(); });
    invertCheck.addEventListener('change', drawNoise);
    gradEnable.addEventListener('change', drawNoise);
    blackBg.addEventListener('change', drawNoise);
    cbBg.addEventListener('change', drawNoise);

    document.getElementById('btn-generate').addEventListener('click', drawNoise);

    // 初始化显示
    window.addEventListener('load', ()=>{
      freqVal.textContent = freqSlider.value;
      octVal.textContent = octSlider.value;
      ampVal.textContent = ampSlider.value;
      document.getElementById('contrast-val').textContent = '1.0';
      document.getElementById('bright-val').textContent = '0';
      drawNoise();
    });

    // 简略类型缩略图填充
    const typeNames = ['噪波','云层','大理石','木纹','水纹','细胞','分形','斑点','条纹','波浪'];
    const sideContainer = document.getElementById('type-browser-side');
    const modalContainer = document.getElementById('type-browser-modal');
    typeNames.forEach(name => {
      const el = document.createElement('div');
      el.className = 'type-thumb';
      el.innerHTML = `<canvas width="40" height="40"></canvas><div>${name}</div>`;
      sideContainer.appendChild(el);
      const clone = el.cloneNode(true);
      modalContainer.appendChild(clone);
    });

    // 模态框开关
    document.getElementById('btn-open-grid-modal').addEventListener('click', ()=>{
      document.getElementById('texture-grid-modal').style.display = 'flex';
    });
    document.getElementById('modal-close-btn').addEventListener('click', ()=>{
      document.getElementById('texture-grid-modal').style.display = 'none';
    });
    document.getElementById('texture-grid-modal').addEventListener('click', (e)=>{
      if (e.target === e.currentTarget) document.getElementById('texture-grid-modal').style.display = 'none';
    });

    // 占位保存按钮
    document.getElementById('btn-save-png').addEventListener('click', ()=>{
      const link = document.createElement('a');
      link.download = 'texture.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
    document.getElementById('btn-save-gif').addEventListener('click', ()=>{
      alert('GIF 导出需要引入 gif.js，此处为占位');
    });
    // 其他按钮占位
    console.log('TextureCreate 中文精简版已启动');
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 生成器 - 安全入口</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0d15;
            /* 背景图容器（通过伪元素实现透明度调节） */
            position: relative;
        }

        /* 背景图层 - 用于控制透明度 */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            opacity: 0.6; /* 默认透明度，滑块控制 */
            z-index: 0;
            transition: opacity 0.2s ease;
        }

        /* 半透明遮罩（让文字更清晰） */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        /* 登录卡片 */
        .login-card {
            position: relative;
            z-index: 2;
            background: rgba(18, 22, 36, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .login-card .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .login-card .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-bottom: 32px;
            letter-spacing: 0.5px;
        }

        .login-card label {
            display: block;
            text-align: left;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .login-card input[type="password"] {
            width: 100%;
            padding: 16px 18px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: #e8edf5;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
        }

        .login-card input[type="password"]:focus {
            border-color: rgba(124, 92, 252, 0.5);
            box-shadow: 0 0 0 4px rgba(124, 92, 252, 0.1);
        }

        .login-card .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-top: 8px;
            min-height: 20px;
            transition: 0.2s;
        }

        .login-card button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #7c5cfc, #a855f7);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 30px rgba(124, 92, 252, 0.25);
            font-family: inherit;
            letter-spacing: 0.5px;
        }

        .login-card button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(124, 92, 252, 0.35);
        }

        .login-card button:active {
            transform: translateY(0);
        }

        /* 透明度控制条 */
        .transparency-control {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            background: rgba(18, 22, 36, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 14px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 500;
        }

        .transparency-control input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 120px;
            height: 3px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
            transition: background 0.3s;
        }

        .transparency-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c5cfc, #a855f7);
            cursor: pointer;
            box-shadow: 0 0 16px rgba(124, 92, 252, 0.3);
        }

        .transparency-control input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #7c5cfc, #a855f7);
            cursor: pointer;
        }

        .transparency-control .value {
            min-width: 36px;
            text-align: center;
            color: #c8b8ff;
            font-weight: 600;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }
            .transparency-control {
                padding: 8px 16px;
                gap: 10px;
                bottom: 16px;
            }
            .transparency-control input[type="range"] {
                width: 80px;
            }
        }

        /* 小提示 */
        .hint {
            margin-top: 16px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
        }
        .hint i {
            margin-right: 4px;
        }
    </style>
</head>
<body>

    <!-- 背景图层（透明度可控） -->
    <div class="bg-layer" id="bgLayer"></div>
    <!-- 半透明遮罩 -->
    <div class="overlay"></div>

    <!-- 登录卡片 -->
    <div class="login-card">
        <div class="logo">✨ AI 生成器</div>
        <div class="subtitle">输入密码进入</div>

        <label for="passwordInput">访问密码</label>
        <input type="password" id="passwordInput" placeholder="请输入密码" autofocus />
        <div class="error-msg" id="errorMsg"></div>

        <button id="loginBtn">进入 <i class="fas fa-arrow-right" style="margin-left:8px;"></i></button>
        <div class="hint"><i class="fas fa-lock"></i> 默认密码：203116</div>
    </div>

    <!-- 透明度控制 -->
    <div class="transparency-control">
        <i class="fas fa-image"></i>
        <span>透明度</span>
        <input type="range" id="opacitySlider" min="0" max="100" value="60" />
        <span class="value" id="opacityValue">60%</span>
    </div>

    <!-- Font Awesome 图标库（用于按钮箭头） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <script>
        (function() {
            const passwordInput = document.getElementById('passwordInput');
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const bgLayer = document.getElementById('bgLayer');
            const opacitySlider = document.getElementById('opacitySlider');
            const opacityValue = document.getElementById('opacityValue');

            const CORRECT_PASSWORD = '203116';
            const TARGET_URL = 'Mys.html';

            // 验证并跳转
            function attemptLogin() {
                const entered = passwordInput.value.trim();
                if (entered === CORRECT_PASSWORD) {
                    // 密码正确，跳转
                    window.location.href = TARGET_URL;
                } else {
                    errorMsg.textContent = '❌ 密码错误，请重试';
                    passwordInput.value = '';
                    passwordInput.focus();
                    // 晃动效果（简单闪烁边框）
                    passwordInput.style.borderColor = '#f87171';
                    setTimeout(() => {
                        passwordInput.style.borderColor = '';
                    }, 800);
                }
            }

            // 事件绑定
            loginBtn.addEventListener('click', attemptLogin);
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    attemptLogin();
                }
            });

            // 背景透明度控制
            opacitySlider.addEventListener('input', function() {
                const val = this.value;
                bgLayer.style.opacity = val / 100;
                opacityValue.textContent = val + '%';
            });

            // 初始化背景透明度（同步滑块）
            bgLayer.style.opacity = opacitySlider.value / 100;
            opacityValue.textContent = opacitySlider.value + '%';

            // 可选：点击页面空白处聚焦密码框
            document.addEventListener('click', function(e) {
                if (e.target.closest('.login-card') === null) {
                    // 点击背景不抢焦点，但这里不强制
                }
            });

            // 控制台提醒
            console.log('🔐 密码为 203116');
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>噪波 · 扰动贴图生成器 (实时版)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0d15;
            color: #e8edf5;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(18,22,36,0.8);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }
        @media (max-width: 860px) {
            .main-grid { grid-template-columns: 1fr; gap: 24px; }
        }
        .panel {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 20px 22px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-group {
            margin-bottom: 16px;
        }
        .control-group label {
            display: block;
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 4px;
        }
        .control-group .flex-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-group input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            border-radius: 4px;
            background: rgba(255,255,255,0.15);
            outline: none;
        }
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c5cfc, #a855f7);
            cursor: pointer;
        }
        .control-group input[type="number"] {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 4px 8px;
            color: #e8edf5;
            width: 60px;
            font-size: 13px;
        }
        .control-group select {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 6px 10px;
            color: #e8edf5;
            width: 100%;
            font-size: 14px;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #7c5cfc, #a855f7);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(124,92,252,0.3);
        }
        .btn.secondary {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .btn.secondary:hover {
            background: rgba(255,255,255,0.12);
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .canvas-wrapper {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .canvas-wrapper canvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }
        .status {
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            margin-top: 8px;
            text-align: center;
        }
        .view-toggle {
            display: flex;
            gap: 8px;
            margin: 12px 0;
        }
        .view-toggle button {
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .view-toggle button.active {
            background: rgba(124,92,252,0.3);
            border-color: rgba(124,92,252,0.4);
            color: #c8b8ff;
        }
        .view-toggle button:hover { background: rgba(255,255,255,0.08); }
        .tag {
            background: rgba(124,92,252,0.15);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #b8acff;
        }
        hr {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin: 16px 0;
        }
        .badge-realtime {
            background: #4ade80;
            color: #0b0d15;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 600;
            margin-left: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌀 噪波 · 扰动贴图生成器 <span style="font-size:14px;background:#4ade80;color:#0b0d15;padding:2px 14px;border-radius:40px;">实时联动</span></h1>
    <div class="main-grid">
        <!-- 左侧控制 -->
        <div class="panel">
            <div class="panel-title"><span>⚙️ 参数 (拖动即生成)</span></div>
            <div class="control-group">
                <label>噪声类型</label>
                <select id="noiseType">
                    <option value="value">Value Noise</option>
                </select>
            </div>
            <div class="control-group">
                <label>频率 <span id="freqVal">4</span></label>
                <input type="range" id="freq" min="1" max="20" value="4" step="0.5" />
            </div>
            <div class="control-group">
                <label>八度 <span id="octVal">3</span></label>
                <input type="range" id="octaves" min="1" max="6" value="3" step="1" />
            </div>
            <div class="control-group">
                <label>幅度 <span id="ampVal">60</span></label>
                <input type="range" id="amplitude" min="10" max="200" value="60" />
            </div>
            <div class="control-group">
                <label>种子</label>
                <input type="number" id="seed" value="42" min="0" max="9999" style="width:80px;" />
            </div>
            <div class="btn-group">
                <button class="btn secondary" id="genDisplaceBtn">🌀 仅刷新扰动</button>
            </div>
            <hr />
            <div class="btn-group">
                <button class="btn secondary" id="downloadNoiseBtn">⬇ 下载噪波</button>
                <button class="btn secondary" id="downloadDisplaceBtn">⬇ 下载扰动</button>
            </div>
            <div class="status" id="statusMsg">就绪 (实时更新)</div>
        </div>

        <!-- 右侧显示 -->
        <div class="panel">
            <div class="panel-title"><span>📺 预览</span> <span class="tag" id="viewLabel">噪波</span></div>
            <div class="view-toggle" id="viewToggle">
                <button class="active" data-view="noise">噪波</button>
                <button data-view="displace">扰动</button>
            </div>
            <div class="canvas-wrapper">
                <canvas id="mainCanvas"></canvas>
            </div>
            <div class="status" id="previewStatus">拖动滑块即可实时更新</div>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ----- DOM 元素 -----
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const noiseType = document.getElementById('noiseType');
        const freqSlider = document.getElementById('freq');
        const freqVal = document.getElementById('freqVal');
        const octavesSlider = document.getElementById('octaves');
        const octVal = document.getElementById('octVal');
        const amplitudeSlider = document.getElementById('amplitude');
        const ampVal = document.getElementById('ampVal');
        const seedInput = document.getElementById('seed');

        const genDisplaceBtn = document.getElementById('genDisplaceBtn');
        const downloadNoiseBtn = document.getElementById('downloadNoiseBtn');
        const downloadDisplaceBtn = document.getElementById('downloadDisplaceBtn');
        const statusMsg = document.getElementById('statusMsg');
        const previewStatus = document.getElementById('previewStatus');
        const viewLabel = document.getElementById('viewLabel');
        const viewToggle = document.getElementById('viewToggle');

        // ----- 状态 -----
        let currentNoiseData = null;
        let currentDisplaceData = null;
        let currentView = 'noise';
        const DEFAULT_SIZE = 512;

        // ----- 工具 -----
        function initCanvas() {
            canvas.width = DEFAULT_SIZE;
            canvas.height = DEFAULT_SIZE;
            ctx.clearRect(0, 0, DEFAULT_SIZE, DEFAULT_SIZE);
        }

        function drawImageData(imageData) {
            if (!imageData) return;
            ctx.putImageData(imageData, 0, 0);
            previewStatus.textContent = `已显示 ${currentView === 'noise' ? '噪波' : '扰动'} (${imageData.width}x${imageData.height})`;
        }

        function updateView() {
            if (currentView === 'noise') {
                if (currentNoiseData) { drawImageData(currentNoiseData); viewLabel.textContent = '噪波'; }
                else { ctx.clearRect(0, 0, canvas.width, canvas.height); previewStatus.textContent = '请生成噪波'; }
            } else {
                if (currentDisplaceData) { drawImageData(currentDisplaceData); viewLabel.textContent = '扰动'; }
                else { ctx.clearRect(0, 0, canvas.width, canvas.height); previewStatus.textContent = '请生成扰动'; }
            }
        }

        // ----- 核心算法 -----
        function valueNoise(width, height, freq, octaves, amplitude, seed) {
            const data = new Uint8Array(width * height * 4);
            function hash(x, y, s) {
                let h = s + x * 374761393 + y * 668265263;
                h = (h ^ (h >> 13)) * 1274126177;
                h = h ^ (h >> 16);
                return (h & 0x7fffffff) / 0x7fffffff;
            }
            function smoothNoise(x, y, f, s) {
                const fx = x / width * f;
                const fy = y / height * f;
                const ix = Math.floor(fx);
                const iy = Math.floor(fy);
                const fx2 = fx - ix;
                const fy2 = fy - iy;
                const ux = fx2 * fx2 * (3 - 2 * fx2);
                const uy = fy2 * fy2 * (3 - 2 * fy2);
                const v00 = hash(ix, iy, s);
                const v10 = hash(ix + 1, iy, s);
                const v01 = hash(ix, iy + 1, s);
                const v11 = hash(ix + 1, iy + 1, s);
                return (v00 * (1-ux) + v10 * ux) * (1-uy) + (v01 * (1-ux) + v11 * ux) * uy;
            }
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let val = 0;
                    let amp = amplitude;
                    let f = freq;
                    for (let o = 0; o < octaves; o++) {
                        val += smoothNoise(x, y, f, seed + o * 100) * amp;
                        amp *= 0.5;
                        f *= 2;
                    }
                    val = Math.max(0, Math.min(1, val));
                    const idx = (y * width + x) * 4;
                    const gray = Math.floor(val * 255);
                    data[idx] = gray;
                    data[idx+1] = gray;
                    data[idx+2] = gray;
                    data[idx+3] = 255;
                }
            }
            return new ImageData(data, width, height);
        }

        function generateDisplaceFromNoise(noiseData) {
            const w = noiseData.width;
            const h = noiseData.height;
            const src = noiseData.data;
            const out = new Uint8Array(w * h * 4);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    const center = src[idx];
                    const left = (x > 0) ? src[(y * w + (x-1)) * 4] : center;
                    const right = (x < w-1) ? src[(y * w + (x+1)) * 4] : center;
                    const gradX = (right - left) / 255.0;
                    const top = (y > 0) ? src[((y-1) * w + x) * 4] : center;
                    const bottom = (y < h-1) ? src[((y+1) * w + x) * 4] : center;
                    const gradY = (bottom - top) / 255.0;
                    const dx = Math.floor((gradX * 0.5 + 0.5) * 255);
                    const dy = Math.floor((gradY * 0.5 + 0.5) * 255);
                    out[idx] = Math.min(255, Math.max(0, dx));
                    out[idx+1] = Math.min(255, Math.max(0, dy));
                    out[idx+2] = 128;
                    out[idx+3] = 255;
                }
            }
            return new ImageData(out, w, h);
        }

        // ----- 生成主函数（更新数据 + 刷新视图） -----
        function generateAll() {
            const w = DEFAULT_SIZE, h = DEFAULT_SIZE;
            const freq = parseFloat(freqSlider.value);
            const octaves = parseInt(octavesSlider.value);
            const amplitude = parseFloat(amplitudeSlider.value);
            const seed = parseInt(seedInput.value) || 42;

            currentNoiseData = valueNoise(w, h, freq, octaves, amplitude, seed);
            currentDisplaceData = generateDisplaceFromNoise(currentNoiseData);
            
            updateView();
            statusMsg.textContent = '✅ 已自动更新';
        }

        // ----- 仅刷新扰动（不改变噪波） -----
        function refreshDisplace() {
            if (!currentNoiseData) {
                statusMsg.textContent = '⚠️ 请先生成噪波';
                return;
            }
            currentDisplaceData = generateDisplaceFromNoise(currentNoiseData);
            if (currentView === 'displace') {
                drawImageData(currentDisplaceData);
                viewLabel.textContent = '扰动';
                previewStatus.textContent = '扰动已刷新';
            } else {
                statusMsg.textContent = '✅ 扰动已更新（切到扰动视图查看）';
            }
        }

        // ----- 下载 -----
        function downloadImageData(imageData, filename) {
            if (!imageData) { statusMsg.textContent = '⚠️ 无内容'; return; }
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = imageData.width;
            tempCanvas.height = imageData.height;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.putImageData(imageData, 0, 0);
            const link = document.createElement('a');
            link.download = filename;
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        }

        // ----- 事件绑定（实时联动核心） -----
        // 数值显示 + 自动生成
        freqSlider.addEventListener('input', () => {
            freqVal.textContent = freqSlider.value;
            generateAll();
        });
        octavesSlider.addEventListener('input', () => {
            octVal.textContent = octavesSlider.value;
            generateAll();
        });
        amplitudeSlider.addEventListener('input', () => {
            ampVal.textContent = amplitudeSlider.value;
            generateAll();
        });
        seedInput.addEventListener('change', generateAll);

        // 单独刷新扰动
        genDisplaceBtn.addEventListener('click', refreshDisplace);

        // 下载
        downloadNoiseBtn.addEventListener('click', () => {
            if (currentNoiseData) downloadImageData(currentNoiseData, 'noise.png');
            else statusMsg.textContent = '⚠️ 无噪波';
        });
        downloadDisplaceBtn.addEventListener('click', () => {
            if (currentDisplaceData) downloadImageData(currentDisplaceData, 'displace.png');
            else statusMsg.textContent = '⚠️ 无扰动';
        });

        // 视图切换
        viewToggle.addEventListener('click', function(e) {
            const btn = e.target.closest('button');
            if (!btn) return;
            const view = btn.dataset.view;
            if (view === currentView) return;
            viewToggle.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentView = view;
            updateView();
        });

        // 初始化
        initCanvas();
        generateAll(); // 首次自动生成

        console.log('🚀 实时噪波生成器已启动');
    })();
</script>
</body>
</html>

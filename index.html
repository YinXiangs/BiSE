<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PVZD9P3TK8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PVZD9P3TK8');
  </script>
  <script src="https://kitchen.juicer.cc/?color=jOkpeoOWByY=" async></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8811653461295537" crossorigin="anonymous"></script>
  <title>TextureCreate</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <meta name="description" content="WebGL2ベースの高機能テクスチャジェネレーター。50種類以上のTypeとグラジエントランプを搭載。">
  <script src="./gif.js"></script>
  <script defer src="https://gameanimation.info/texture-create/revenue-cta.js?v=20260813exporttools"></script>
  <script type="module" crossorigin src="./assets/index-kjwQBLh7.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DWbzMXm_.css">
</head>

<body>
  <div id="texture-create-app" class="mobile-view-preview">

    <!-- ヘッダー（ShaderCreate準拠） -->
    <div id="header">
      <div id="header-left" style="display:flex; align-items:center; gap: 10px;">
        <span id="app-title">TextureCreate</span>
        <span class="header-links" style="font-size: 0.8em; color: #888; display: flex; align-items: center; gap: 8px;">
          <span>by <a href="https://gameanimation.info/" target="_blank"
              style="color:#aaa; text-decoration:none;">ゲームUI演出</a></span>
          <span style="color: #666;">|</span>
          <a id="link-terms" href="https://gameanimation.info/?p=5200" target="_blank"
            style="color:#aaa; text-decoration:underline;">利用規約</a>
          <span style="color: #666;">|</span>
          <a href="https://gameanimation.booth.pm/items/4334040" target="_blank"
            style="color:#aaa; text-decoration:underline;">Effect_Ideas_100</a>
          <span style="color: #666;">|</span>
          <a href="https://gameanimation.booth.pm/items/3147121" target="_blank"
            style="color:#aaa; text-decoration:underline;">Texture_Ideas_100</a>
          <span style="color: #666;">|</span>
          <a href="https://gameanimation.booth.pm/items/5424271" target="_blank"
            style="color:#aaa; text-decoration:underline;">Particle_Ideas_100</a>
        </span>
        <span id="editor-save-status" class="editor-save-status" aria-live="polite"></span>
      </div>
      <div id="header-right">
        <div class="editor-command-group" role="group" aria-label="Editor history">
          <button id="btn-editor-undo" class="editor-command-btn header-btn" type="button" data-i18n-key="Undo" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4.5 11.5 9 16"/><path d="M5 11.5h7.5a6 6 0 0 1 6 6"/></svg>
          </button>
          <button id="btn-editor-redo" class="editor-command-btn header-btn" type="button" data-i18n-key="Redo" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 4.5 4.5L15 16"/><path d="M19 11.5h-7.5a6 6 0 0 0-6 6"/></svg>
          </button>
          <button id="btn-editor-share" class="editor-command-btn header-btn" type="button" data-i18n-key="Share Editor">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="m8.7 10.8 6.6-3.9M8.7 13.2l6.6 3.9"/></svg>
          </button>
        </div>
        <!-- プリセット セーブ・ロード (移動後) -->
        <button id="btn-save-preset" class="preset-btn header-btn preset-file-action" data-i18n-key="Save Preset">Save Preset</button>
        <button id="btn-load-preset" class="preset-btn header-btn preset-file-action" data-i18n-key="Load Preset">Load Preset</button>
        <input type="file" id="input-load-preset" accept=".json" style="display:none;" />
        
        <button id="btn-lang-toggle" class="header-btn"
          style="background:transparent;border:1px solid #444;color:#ccc;cursor:pointer;border-radius:4px;padding:2px 8px;margin-left:12px;font-size:0.8rem;">🌐
          EN</button>
      </div>
    </div>

    <!-- メイン4カラム -->
    <div id="body">

      <!-- レイヤーパネル (新設) -->
      <div id="layer-panel" class="layer-side-panel">
        <div class="layer-panel-header">
          <button id="btn-add-layer-top" class="layer-add-btn" title="Add Layer">+</button>
        </div>
        <div id="layer-list-container">
          <!-- JSからレイヤーアイテムを流し込む -->
        </div>
      </div>

      <!-- 左パネル: Type・Params -->
      <div id="left-panel" class="side-panel">
        <div id="gui-left">
          <!-- JS から生成 -->
        </div>
      </div>

      <!-- サムネイルパネル（ラッパー + トグルタブ） -->
      <div id="type-panel-shell">
        <div id="thumbnail-panel-wrapper" class="thumbnail-panel-wrapper">
          <div id="thumbnail-panel" class="thumbnail-side-panel">
            <div id="thumbnail-grid-container">
              <div id="type-browser-side"></div>
            </div>
          </div>
        </div>
        <!-- 右端のタブボタン（常に表示） -->
        <button id="btn-toggle-thumb-panel" class="thumb-toggle-tab" title="Toggle Types">◀</button>
      </div>

      <!-- 中央: TopPanel + Canvas -->
      <div id="center-column">
        <!-- TopPanel（エクスポートボタン等） -->
        <div id="top-panel">
          
          <!-- Save Export ドロップダウン -->
          <div class="dropdown">
            <button id="btn-save-export-dropdown" class="export-btn dropdown-btn" style="background:#2d88ff;">Save Export ▼</button>
            <div class="dropdown-content">
              <button id="btn-save-png">PNG 保存</button>
              <button id="btn-save-gif">GIF 保存</button>
              <button id="btn-save-normal">ノーマルマップ保存</button>
              <button id="btn-open-sheet-export" data-i18n-key="Sheet Export">シート書き出し</button>
              <button id="btn-open-channel-pack" data-i18n-key="Channel Pack">チャンネルパック</button>
            </div>
          </div>

          <button id="btn-quick-start" class="export-btn quick-start-open-btn" type="button"
            data-i18n-key="Samples">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2.75l1.4 4.1 4.1 1.4-4.1 1.4-1.4 4.1-1.4-4.1-4.1-1.4 4.1-1.4L12 2.75Z" />
              <path d="M18.25 13.25l.85 2.4 2.4.85-2.4.85-.85 2.4-.85-2.4-2.4-.85 2.4-.85.85-2.4Z" />
              <path d="M5.25 13.75l.65 1.85 1.85.65-1.85.65-.65 1.85-.65-1.85-1.85-.65 1.85-.65.65-1.85Z" />
            </svg>
            <span data-i18n-label></span>
          </button>
          
          <button id="btn-open-grid-modal" class="export-btn" style="background:#2196f3;"
            data-i18n-key="Type Browser Open" data-i18n-label></button>
          
          <div class="top-divider"></div>
          
          <!-- 背景色トグル -->
          <div class="preset-controls">
            <div style="display: flex; flex-wrap: nowrap; gap: 10px; margin-left: auto;">
              <label
                style="color: #fff; font-size: 13px; display: flex; align-items: center; cursor: pointer; white-space: nowrap;">
                <input type="checkbox" id="chk-black-bg" style="margin-right: 5px;" />
                <span id="label-black-bg">Black Bg</span>
              </label>
              <label
                style="color: #fff; font-size: 13px; display: flex; align-items: center; cursor: pointer; white-space: nowrap;">
                <input type="checkbox" id="chk-cb-bg" style="margin-right: 5px;" checked />
                <span id="label-cb-bg">CB Bg</span>
              </label>
            </div>
          </div>
        </div>


        <!-- キャンバスエリア -->
        <div id="canvas-area">
          <div id="preview-canvas-container">
            <canvas id="preview-canvas" width="512" height="512"></canvas>
            <div id="canvas-overlay">512 × 512 px</div>
          </div>
        </div>
      </div>

      <!-- 右パネル: Post-process・Gradient -->
      <div id="right-panel" class="side-panel">
        <div id="gui-right">
          <!-- JS から生成 -->
        </div>

        <!-- グラジエントランプセクション -->
        <div id="gradient-section">
          <div class="category-header" id="grad-cat-header">
            グラジエントランプ機能
            <label class="check-label" onclick="event.stopPropagation()">
              <input type="checkbox" id="grad-enable-toggle" />
              <span class="grad-enable-text">有効</span>
            </label>
          </div>
          <div id="gradient-editor-area"></div>
        </div>
      </div>

    </div><!-- /#body -->

    <nav id="mobile-panel-tabs" aria-label="" role="tablist">
      <button class="mobile-panel-tab is-active" type="button" role="tab" aria-selected="true"
        data-mobile-panel="preview" data-i18n-key="Mobile Preview">
        <span class="mobile-tab-icon" aria-hidden="true">▣</span>
        <span class="mobile-tab-label"></span>
      </button>
      <button class="mobile-panel-tab" type="button" role="tab" aria-selected="false"
        data-mobile-panel="types" data-i18n-key="Mobile Types">
        <span class="mobile-tab-icon" aria-hidden="true">▦</span>
        <span class="mobile-tab-label"></span>
      </button>
      <button class="mobile-panel-tab" type="button" role="tab" aria-selected="false"
        data-mobile-panel="settings" data-i18n-key="Mobile Settings">
        <span class="mobile-tab-icon" aria-hidden="true">☷</span>
        <span class="mobile-tab-label"></span>
      </button>
      <button class="mobile-panel-tab" type="button" role="tab" aria-selected="false"
        data-mobile-panel="layers" data-i18n-key="Mobile Layers">
        <span class="mobile-tab-icon" aria-hidden="true">◫</span>
        <span class="mobile-tab-label"></span>
      </button>
    </nav>
  </div><!-- /#texture-create-app -->

  <div id="quick-start-toast" class="quick-start-toast" role="status" aria-live="polite" hidden></div>

  <!-- スプライトシート・カラーバリエーション書き出し -->
  <div id="sheet-export-modal" class="sheet-export-overlay" hidden>
    <section class="sheet-export-dialog" role="dialog" aria-modal="true" aria-labelledby="sheet-export-title">
      <header class="sheet-export-header">
        <div>
          <h2 id="sheet-export-title" data-sheet-i18n="Sheet Export Title"></h2>
          <p data-sheet-i18n="Sheet Export Lead"></p>
        </div>
        <button id="sheet-export-close" class="sheet-export-close" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11m0-11-11 11" /></svg>
        </button>
      </header>
      <div class="sheet-export-body">
        <div class="sheet-export-preview-panel">
          <div class="sheet-export-section-label" data-sheet-i18n="Sheet Export Preview"></div>
          <div class="sheet-export-preview-frame">
            <canvas id="sheet-preview-canvas" width="256" height="128"></canvas>
          </div>
          <div class="sheet-export-output-summary">
            <div><span data-sheet-i18n="Sheet Export Output"></span><strong id="sheet-output-size"></strong></div>
            <code id="sheet-grid-info"></code>
          </div>
        </div>
        <div class="sheet-export-settings">
          <fieldset class="sheet-export-fieldset">
            <legend data-sheet-i18n="Sheet Export Mode"></legend>
            <div class="sheet-export-mode-tabs">
              <label><input type="radio" name="sheet-mode" value="animation" checked><span data-sheet-i18n="Sheet Export Animation"></span></label>
              <label><input type="radio" name="sheet-mode" value="colors"><span data-sheet-i18n="Sheet Export Colors"></span></label>
            </div>
            <p id="sheet-mode-help" class="sheet-export-help"></p>
          </fieldset>
          <div class="sheet-export-control-grid">
            <label><span data-sheet-i18n="Sheet Export Frames"></span><select id="sheet-frame-count"><option value="4">4</option><option value="8" selected>8</option><option value="16">16</option></select></label>
            <label><span data-sheet-i18n="Sheet Export Cell Size"></span><select id="sheet-cell-size"><option value="64">64 px</option><option value="128">128 px</option><option value="256" selected>256 px</option><option value="512">512 px</option></select></label>
            <label><span data-sheet-i18n="Sheet Export Columns"></span><select id="sheet-columns"><option value="2">2</option><option value="4" selected>4</option><option value="8">8</option></select></label>
            <label><span data-sheet-i18n="Sheet Export Padding"></span><select id="sheet-padding"><option value="0">0 px</option><option value="1">1 px</option><option value="2" selected>2 px</option><option value="4">4 px</option></select></label>
          </div>
          <label class="sheet-export-metadata"><input id="sheet-save-metadata" type="checkbox" checked><span data-sheet-i18n="Sheet Export Metadata"></span></label>
          <button id="sheet-generate" class="sheet-export-generate" type="button" data-sheet-i18n="Sheet Export Generate"></button>
        </div>
      </div>
    </section>
  </div>

  <!-- チャンネルパック書き出し -->
  <div id="channel-pack-modal" class="sheet-export-overlay" hidden>
    <section class="sheet-export-dialog channel-pack-dialog" role="dialog" aria-modal="true" aria-labelledby="channel-pack-title" aria-describedby="channel-pack-lead">
      <header class="sheet-export-header">
        <div>
          <h2 id="channel-pack-title" data-channel-i18n="Channel Pack Title"></h2>
          <p id="channel-pack-lead" data-channel-i18n="Channel Pack Lead"></p>
        </div>
        <button id="channel-pack-close" class="sheet-export-close" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11m0-11-11 11" /></svg>
        </button>
      </header>
      <div class="sheet-export-body">
        <div class="sheet-export-preview-panel">
          <div class="sheet-export-section-label" data-channel-i18n="Channel Pack Preview"></div>
          <div class="sheet-export-preview-frame channel-pack-preview-frame">
            <canvas id="channel-pack-preview-canvas" width="192" height="192"></canvas>
          </div>
          <div class="sheet-export-output-summary">
            <div><span data-channel-i18n="Channel Pack Output"></span><strong id="channel-pack-output-size">512 × 512px</strong></div>
            <code>RGBA PNG</code>
          </div>
        </div>
        <div class="sheet-export-settings">
          <label class="channel-pack-field">
            <span data-channel-i18n="Channel Pack Preset"></span>
            <select id="channel-pack-preset">
              <option value="base" data-channel-i18n="Channel Pack Preset Base"></option>
              <option value="normal_xy" data-channel-i18n="Channel Pack Preset Normal XY"></option>
              <option value="normal_xyz" data-channel-i18n="Channel Pack Preset Normal XYZ"></option>
              <option value="luma_alpha" data-channel-i18n="Channel Pack Preset Luma"></option>
            </select>
          </label>
          <div class="channel-pack-grid">
            <label class="channel-pack-field"><span>R</span><select id="channel-pack-r"></select></label>
            <label class="channel-pack-field"><span>G</span><select id="channel-pack-g"></select></label>
            <label class="channel-pack-field"><span>B</span><select id="channel-pack-b"></select></label>
            <label class="channel-pack-field"><span>A</span><select id="channel-pack-a"></select></label>
          </div>
          <p class="channel-pack-help" data-channel-i18n="Channel Pack Help"></p>
          <button id="channel-pack-generate" class="sheet-export-generate" type="button" data-channel-i18n="Channel Pack Generate"></button>
        </div>
      </div>
    </section>
  </div>

  <!-- サンプル・保存プリセット統合ライブラリ -->
  <div id="preset-library-modal" class="sheet-export-overlay" hidden>
    <section class="sheet-export-dialog preset-library-dialog" role="dialog" aria-modal="true" aria-labelledby="preset-library-title" aria-describedby="preset-library-lead">
      <header class="sheet-export-header">
        <div>
          <h2 id="preset-library-title" data-preset-i18n="Preset Library Title"></h2>
          <p id="preset-library-lead" data-preset-i18n="Preset Library Lead"></p>
        </div>
        <button id="preset-library-close" class="sheet-export-close" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11m0-11-11 11" /></svg>
        </button>
      </header>
      <div class="preset-library-body">
        <div class="preset-library-list-header preset-library-builtin-header">
          <div>
            <strong data-preset-i18n="Preset Library Builtin"></strong>
            <p data-preset-i18n="Preset Library Builtin Lead"></p>
          </div>
          <span id="preset-library-builtin-count"></span>
        </div>
        <div id="preset-library-builtin-list" class="preset-library-builtin-list"></div>
        <div class="preset-library-save-panel">
          <label for="preset-library-name" data-preset-i18n="Preset Library Name"></label>
          <div class="preset-library-save-row">
            <input id="preset-library-name" type="text" maxlength="60" autocomplete="off">
            <button id="preset-library-save" type="button" data-preset-i18n="Preset Library Save"></button>
          </div>
          <p data-preset-i18n="Preset Library Save Help"></p>
        </div>
        <div class="preset-library-list-header">
          <strong data-preset-i18n="Preset Library List"></strong>
          <span id="preset-library-count"></span>
        </div>
        <div id="preset-library-list" class="preset-library-list"></div>
      </div>
    </section>
  </div>

  <!-- 全画面テクスチャグリッドモーダル -->
  <div id="texture-grid-modal" class="modal-overlay" style="display: none;">
    <section class="modal-content" role="dialog" aria-modal="true" aria-labelledby="texture-grid-modal-title">
      <div class="modal-header">
        <span id="texture-grid-modal-title" class="modal-title" data-i18n-key="Type Browser Title"></span>
        <button id="modal-close-btn" class="modal-close" type="button" data-i18n-key="Quick Start Close">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 6.5l11 11m0-11-11 11" />
          </svg>
        </button>
      </div>
      <div id="type-browser-modal"></div>
    </section>
  </div>

  <!-- GIF書き出し用プログレス・オーバーレイ -->
  <div id="gif-progress-overlay" class="modal-overlay"
    style="display: none; z-index: 10000; flex-direction: column; justify-content: center; align-items: center;">
    <div
      style="background: rgba(30, 30, 30, 0.9); padding: 30px; border-radius: 8px; border: 1px solid #444; text-align: center; min-width: 300px;">
      <h3 id="gif-progress-text" style="color: #fff; margin-top: 0; margin-bottom: 20px;">GIF 保存中... 0%</h3>
      <div style="width: 100%; background: #222; height: 10px; border-radius: 5px; overflow: hidden;">
        <div id="gif-progress-bar" style="width: 0%; height: 100%; background: #e91e63; transition: width 0.1s;"></div>
      </div>
    </div>
  </div>

</body>

</html>

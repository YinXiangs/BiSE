<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>噪波生成 - 诊断版</title>
    <style>
        body {
            background: #0b0d15;
            color: #e8edf5;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 2px solid #7c5cfc;
            border-radius: 16px;
            background: #1a1a2e;
            width: 512px;
            height: 512px;
            max-width: 90vw;
            max-height: 90vw;
        }
        button {
            margin-top: 20px;
            padding: 12px 32px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #7c5cfc, #a855f7);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        p {
            color: rgba(255,255,255,0.5);
            margin-top: 12px;
        }
        #status {
            color: #f87171;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="512" height="512"></canvas>
    <button id="genBtn">🎲 生成噪波</button>
    <p id="status">等待生成...</p>

    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const status = document.getElementById('status');

            // 核心：Value Noise 生成
            function generateNoise(width, height, freq, octaves, amplitude, seed) {
                const data = new Uint8Array(width * height * 4);
                function hash(x, y, s) {
                    let h = s + x * 374761393 + y * 668265263;
                    h = (h ^ (h >> 13)) * 1274126177;
                    h = h ^ (h >> 16);
                    return (h & 0x7fffffff) / 0x7fffffff;
                }
                function smoothNoise(x, y, f, s) {
                    const fx = x / width * f;
                    const fy = y / height * f;
                    const ix = Math.floor(fx);
                    const iy = Math.floor(fy);
                    const fx2 = fx - ix;
                    const fy2 = fy - iy;
                    const ux = fx2 * fx2 * (3 - 2 * fx2);
                    const uy = fy2 * fy2 * (3 - 2 * fy2);
                    const v00 = hash(ix, iy, s);
                    const v10 = hash(ix + 1, iy, s);
                    const v01 = hash(ix, iy + 1, s);
                    const v11 = hash(ix + 1, iy + 1, s);
                    return (v00 * (1-ux) + v10 * ux) * (1-uy) + (v01 * (1-ux) + v11 * ux) * uy;
                }
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        let val = 0;
                        let amp = amplitude;
                        let f = freq;
                        for (let o = 0; o < octaves; o++) {
                            val += smoothNoise(x, y, f, seed + o * 100) * amp;
                            amp *= 0.5;
                            f *= 2;
                        }
                        val = Math.max(0, Math.min(1, val));
                        const idx = (y * width + x) * 4;
                        const gray = Math.floor(val * 255);
                        data[idx] = gray;
                        data[idx+1] = gray;
                        data[idx+2] = gray;
                        data[idx+3] = 255;
                    }
                }
                return new ImageData(data, width, height);
            }

            function drawNoise() {
                try {
                    status.textContent = '⏳ 生成中...';
                    // 固定参数，确保生成成功
                    const imageData = generateNoise(512, 512, 4, 3, 60, 42);
                    ctx.putImageData(imageData, 0, 0);
                    status.textContent = '✅ 生成成功！';
                    status.style.color = '#4ade80';
                    console.log('噪波已绘制，数据长度:', imageData.data.length);
                } catch (err) {
                    status.textContent = '❌ 生成失败: ' + err.message;
                    status.style.color = '#f87171';
                    console.error(err);
                }
            }

            document.getElementById('genBtn').addEventListener('click', drawNoise);

            // 页面加载自动生成一次
            window.addEventListener('load', drawNoise);
        })();
    </script>
</body>
</html>

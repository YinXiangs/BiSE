<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 图片与视频生成器 (Agnes AI)</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- 全局样式 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0d15;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            max-width: 1200px;
            width: 100%;
            background: rgba(18, 22, 36, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 12px;
            background: rgba(124,92,252,0.2);
            border: 1px solid rgba(124,92,252,0.25);
            color: #b8acff;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 30px;
        }
        @media (max-width: 860px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }
        .panel {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 20px 22px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .panel-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .prompt-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px 16px;
            color: #e8edf5;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: 0.3s;
        }
        .prompt-input:focus {
            outline: none;
            border-color: rgba(124,92,252,0.5);
            box-shadow: 0 0 0 4px rgba(124,92,252,0.1);
        }
        .mode-toggle {
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.25);
            border-radius: 14px;
            padding: 4px;
            margin: 16px 0 12px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 11px;
            background: transparent;
            color: rgba(255,255,255,0.4);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #7c5cfc, #a855f7);
            color: #fff;
            box-shadow: 0 4px 20px rgba(124,92,252,0.3);
        }
        .mode-btn:hover:not(.active) {
            color: rgba(255,255,255,0.7);
        }
        .api-key-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 14px;
            color: #e8edf5;
            font-size: 14px;
            font-family: inherit;
            margin: 6px 0 14px;
        }
        .api-key-input:focus {
            outline: none;
            border-color: rgba(124,92,252,0.5);
        }
        .generate-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #7c5cfc, #a855f7);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 30px rgba(124,92,252,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(124,92,252,0.35);
        }
        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .result-box {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            overflow: hidden;
            min-height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .result-box img, .result-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .placeholder {
            color: rgba(255,255,255,0.15);
            text-align: center;
            pointer-events: none;
        }
        .placeholder i {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.3;
        }
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 10px 22px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .action-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-color: rgba(255,255,255,0.15);
        }
        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .action-btn.primary {
            background: linear-gradient(135deg, #7c5cfc, #a855f7);
            border-color: transparent;
            color: #fff;
        }
        .action-btn.primary:hover:not(:disabled) {
            box-shadow: 0 6px 24px rgba(124,92,252,0.3);
            transform: translateY(-1px);
        }
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
            display: none;
        }
        .progress-container.active {
            display: block;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c5cfc, #f472b6);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .status-text {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-top: 6px;
            text-align: center;
            min-height: 22px;
        }
        .hint {
            font-size: 12px;
            color: rgba(255,255,255,0.2);
            margin-top: 10px;
            text-align: center;
        }
        .hint a {
            color: #a78bfa;
            text-decoration: none;
        }
        .hint a:hover {
            text-decoration: underline;
        }
        .model-select {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 10px 14px;
            color: #e8edf5;
            font-size: 14px;
            margin-top: 4px;
        }
        .model-select:focus {
            outline: none;
            border-color: rgba(124,92,252,0.5);
        }
        .model-select option {
            background: #1a1e2e;
        }
    </style>
</head>
<body>

<div class="app">
    <!-- 头部 -->
    <header class="header">
        <div class="logo"><i class="fas fa-wand-magic-sparkles" style="background:linear-gradient(135deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:8px;"></i> AI 生成器</div>
        <span class="badge"><i class="fas fa-circle" style="color:#4ade80;font-size:8px;margin-right:6px;"></i> Agnes API</span>
    </header>

    <!-- 主布局 -->
    <div class="main-grid">
        <!-- 左侧控制 -->
        <div class="panel">
            <div class="panel-label"><i class="fas fa-key"></i> API 密钥</div>
            <input type="password" class="api-key-input" id="apiKeyInput" value="sk-f2QiC6SbhR5k1eIP6bEuRxn3aE9ODCk66kNJ2YmtjrnKgP8A" placeholder="输入你的 Agnes API Key (sk-xxx)" />
            <div style="font-size:12px;color:rgba(255,255,255,0.25);margin:-6px 0 14px;">密钥仅保存在本地，不会上传</div>

            <div class="panel-label"><i class="fas fa-pen-fancy"></i> 提示词</div>
            <textarea class="prompt-input" id="promptInput" placeholder="描述你想要的画面… 例如：一只猫在太空舱里">一只橘猫坐在宇航员头盔里，看向地球</textarea>

            <div class="panel-label" style="margin-top:16px;"><i class="fas fa-cubes"></i> 模型选择</div>
            <select class="model-select" id="modelSelect">
                <option value="agnes-image-2.0-flash" data-type="image">图片: agnes-image-2.0-flash (免费)</option>
                <option value="agnes-video-v2.0" data-type="video">视频: agnes-video-v2.0 (免费)</option>
            </select>

            <div class="mode-toggle" id="modeToggle">
                <button class="mode-btn active" data-mode="image"><i class="fas fa-image"></i> 图片</button>
                <button class="mode-btn" data-mode="video"><i class="fas fa-video"></i> 视频</button>
            </div>

            <button class="generate-btn" id="generateBtn">
                <span><i class="fas fa-rocket"></i></span> 生成
            </button>
            <div class="progress-container" id="progressContainer">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status-text" id="statusText">就绪</div>
            <div class="hint">
                <i class="fas fa-info-circle"></i> 视频生成需 1~3 分钟，请耐心等待
            </div>
        </div>

        <!-- 右侧展示 -->
        <div>
            <div class="result-box" id="resultBox">
                <div class="placeholder" id="placeholder">
                    <i class="fas fa-image"></i>
                    <p>输入提示词，点击生成</p>
                </div>
                <!-- 动态插入 img 或 video -->
            </div>
            <div class="actions">
                <button class="action-btn primary" id="downloadBtn" disabled><i class="fas fa-download"></i> 下载</button>
                <button class="action-btn" id="resetBtn"><i class="fas fa-undo-alt"></i> 重置</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        'use strict';

        // ---------- DOM 引用 ----------
        const apiKeyInput = document.getElementById('apiKeyInput');
        const promptInput = document.getElementById('promptInput');
        const modeToggle = document.getElementById('modeToggle');
        const modelSelect = document.getElementById('modelSelect');
        const generateBtn = document.getElementById('generateBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const resultBox = document.getElementById('resultBox');
        const placeholder = document.getElementById('placeholder');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ---------- 状态 ----------
        let currentMode = 'image';   // 'image' | 'video'
        let isGenerating = false;
        let generatedBlobURL = null;  // 用于下载
        let currentMedia = null;     // img 或 video 元素

        // ---------- API 端点 ----------
        const BASE_URL = 'https://api.agnes-ai.com/v1';
        const IMAGE_ENDPOINT = '/images/generations';
        const VIDEO_CREATE_ENDPOINT = '/videos/generations';
        const VIDEO_GET_ENDPOINT = (id) => `/videos/${id}`;

        // 模型映射（根据选择自动切换）
        function getModel() {
            return modelSelect.value;
        }

        // ---------- 模式切换（同步更新下拉框） ----------
        modeToggle.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                modeToggle.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMode = this.dataset.mode;
                // 自动切换下拉框选项
                const options = modelSelect.options;
                for (let opt of options) {
                    if (opt.dataset.type === currentMode) {
                        modelSelect.value = opt.value;
                        break;
                    }
                }
                resetDisplay();
                statusText.textContent = '就绪';
            });
        });

        // 当下拉改变时，同步模式
        modelSelect.addEventListener('change', function() {
            const type = this.options[this.selectedIndex].dataset.type;
            if (type && type !== currentMode) {
                modeToggle.querySelectorAll('.mode-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.mode === type);
                });
                currentMode = type;
                resetDisplay();
                statusText.textContent = '就绪';
            }
        });

        // ---------- 重置显示 ----------
        function resetDisplay() {
            if (currentMedia) {
                currentMedia.remove();
                currentMedia = null;
            }
            placeholder.style.display = 'flex';
            downloadBtn.disabled = true;
            generatedBlobURL = null;
            progressFill.style.width = '0%';
            progressContainer.classList.remove('active');
            statusText.textContent = '就绪';
        }

        // ---------- 生成按钮 ----------
        generateBtn.addEventListener('click', async function() {
            if (isGenerating) return;

            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                statusText.textContent = '⚠️ 请先输入 API 密钥';
                apiKeyInput.focus();
                return;
            }
            const prompt = promptInput.value.trim();
            if (!prompt) {
                statusText.textContent = '⚠️ 请输入提示词';
                promptInput.focus();
                return;
            }

            // 禁用按钮，显示加载
            isGenerating = true;
            generateBtn.disabled = true;
            downloadBtn.disabled = true;
            resetDisplay();
            progressContainer.classList.add('active');
            progressFill.style.width = '0%';
            statusText.textContent = '⏳ 准备中...';

            try {
                if (currentMode === 'image') {
                    await generateImage(apiKey, prompt);
                } else {
                    await generateVideo(apiKey, prompt);
                }
            } catch (error) {
                console.error(error);
                statusText.textContent = '❌ 生成失败: ' + error.message;
                progressContainer.classList.remove('active');
            } finally {
                isGenerating = false;
                generateBtn.disabled = false;
            }
        });

        // ---------- 图片生成 ----------
        async function generateImage(apiKey, prompt) {
            const model = getModel();
            const response = await fetch(BASE_URL + IMAGE_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: model,
                    prompt: prompt,
                    n: 1,
                    size: '1024x1024',   // 部分模型支持
                    negative_prompt: 'blurry, ugly, bad anatomy'
                })
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errText}`);
            }

            const data = await response.json();
            // Agnes 可能返回 data[0].url 或 output 字段，兼容处理
            let imageUrl = null;
            if (data.data && data.data[0] && data.data[0].url) {
                imageUrl = data.data[0].url;
            } else if (data.output) {
                imageUrl = data.output;
            } else {
                throw new Error('API 返回格式异常，未找到图片 URL');
            }

            displayImage(imageUrl);
            generatedBlobURL = imageUrl;
            downloadBtn.disabled = false;
            statusText.textContent = '✅ 图片生成成功！';
            progressFill.style.width = '100%';
            setTimeout(() => progressContainer.classList.remove('active'), 800);
        }

        function displayImage(url) {
            if (currentMedia) currentMedia.remove();
            const img = document.createElement('img');
            img.src = url;
            img.alt = '生成的图片';
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'contain';
            resultBox.appendChild(img);
            currentMedia = img;
            placeholder.style.display = 'none';
        }

        // ---------- 视频生成 ----------
        async function generateVideo(apiKey, prompt) {
            const model = getModel();
            // 1. 创建视频任务
            statusText.textContent = '⏳ 提交视频任务...';
            progressFill.style.width = '10%';

            const createRes = await fetch(BASE_URL + VIDEO_CREATE_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: model,
                    prompt: prompt,
                    // 可选参数：帧数、时长等，具体视模型支持
                    // num_frames: 49,
                    // fps: 15,
                    // guidance_scale: 7,
                    // num_inference_steps: 50
                })
            });

            if (!createRes.ok) {
                const errText = await createRes.text();
                throw new Error(`创建任务失败: ${createRes.status} ${errText}`);
            }

            const createData = await createRes.json();
            const videoId = createData.id || createData.task_id;
            if (!videoId) {
                throw new Error('未获取到视频任务 ID');
            }

            // 2. 轮询任务状态
            statusText.textContent = '🎬 视频生成中，请耐心等待...';
            let progress = 10;
            let done = false;
            let attempts = 0;
            const maxAttempts = 120; // 最多等待 4 分钟（每2秒一次）

            while (!done && attempts < maxAttempts) {
                attempts++;
                await sleep(2000);

                const pollRes = await fetch(BASE_URL + VIDEO_GET_ENDPOINT(videoId), {
                    headers: { 'Authorization': `Bearer ${apiKey}` }
                });
                if (!pollRes.ok) {
                    const errText = await pollRes.text();
                    throw new Error(`轮询失败: ${pollRes.status} ${errText}`);
                }
                const pollData = await pollRes.json();
                const status = pollData.status;

                if (status === 'succeeded' || status === 'completed') {
                    done = true;
                    const videoUrl = pollData.output || pollData.url || pollData.video_url;
                    if (!videoUrl) {
                        throw new Error('视频生成成功但未返回 URL');
                    }
                    displayVideo(videoUrl);
                    generatedBlobURL = videoUrl;
                    downloadBtn.disabled = false;
                    statusText.textContent = '✅ 视频生成成功！';
                    progressFill.style.width = '100%';
                    setTimeout(() => progressContainer.classList.remove('active'), 800);
                } else if (status === 'failed') {
                    throw new Error(`视频生成失败: ${pollData.error || '未知错误'}`);
                } else {
                    // 更新进度（模拟）
                    progress = Math.min(10 + (attempts / maxAttempts) * 80, 90);
                    progressFill.style.width = progress + '%';
                    statusText.textContent = `⏳ 生成中 ${Math.round(progress)}%`;
                }
            }

            if (!done) {
                throw new Error('视频生成超时，请重试');
            }
        }

        function displayVideo(url) {
            if (currentMedia) currentMedia.remove();
            const video = document.createElement('video');
            video.src = url;
            video.controls = true;
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.style.width = '100%';
            video.style.height = '100%';
            video.style.objectFit = 'contain';
            resultBox.appendChild(video);
            currentMedia = video;
            placeholder.style.display = 'none';
        }

        // ---------- 辅助 ----------
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ---------- 下载 ----------
        downloadBtn.addEventListener('click', function() {
            if (!generatedBlobURL) return;
            const ext = currentMode === 'image' ? 'png' : 'webm';
            const filename = `ai_${currentMode}_${Date.now()}.${ext}`;
            // 如果是URL，fetch为blob
            fetch(generatedBlobURL)
                .then(res => {
                    if (!res.ok) throw new Error('下载失败');
                    return res.blob();
                })
                .then(blob => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(a.href);
                })
                .catch(() => {
                    // fallback: 使用原URL下载（可能跨域）
                    const a = document.createElement('a');
                    a.href = generatedBlobURL;
                    a.download = filename;
                    a.target = '_blank';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                });
        });

        // ---------- 重置 ----------
        resetBtn.addEventListener('click', function() {
            resetDisplay();
            progressContainer.classList.remove('active');
            statusText.textContent = '已重置';
        });

        // ---------- 键盘快捷键 ----------
        promptInput.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                generateBtn.click();
            }
        });

        // ---------- 初始化提示 ----------
        console.log('⚠️ 请勿将包含API密钥的页面公开分享。密钥仅保存在本地。');
        // 预填充状态
        statusText.textContent = '就绪，请输入提示词';

    })();
</script>

</body>
</html>
